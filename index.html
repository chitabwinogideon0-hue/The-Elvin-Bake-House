/* Responsive layout: keeps the existing HTML and adapts it to different screens */
html {
    width: 100%;
    overflow-x: hidden;
}

body {
    width: 100%;
    max-width: 100%;
    margin: 0;
    overflow-wrap: break-word;
}

img {
    max-width: 100%;
    height: auto;
}

header {
    width: 100%;
    height: auto;
    min-height: 110px;
    padding: 12px 20px;
    gap: 12px;
    flex-wrap: wrap;
}

header img {
    max-width: 100%;
    width: clamp(120px, 22vw, 220px);
    height: auto;
    margin-left: 0;
    padding: 8px;
    object-fit: contain;
}

nav {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 0;
}

nav a {
    margin: 0;
    padding: 6px 10px;
    font-size: clamp(14px, 1.6vw, 22px);
    border-right: 1px solid #b8860b;
}

.about,
.contact {
    width: min(800px, calc(100% - 32px));
    max-width: 100%;
    margin: 0 auto 24px;
    padding: clamp(16px, 4vw, 30px);
}

.images {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
    padding: clamp(12px, 3vw, 30px);
}

.container {
    width: 100%;
    flex-wrap: wrap;
    gap: 16px;
    padding: clamp(12px, 3vw, 30px);
}

.food {
    min-width: 0;
}

.product {
    min-width: 0;
}

.product img {
    width: 100%;
    max-width: 100%;
    height: 180px;
    object-fit: contain;
}

.img {
    width: 100%;
}

.img img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 850px;
    object-fit: cover;
}

h1, h2, h3, h4 {
    font-size: clamp(21px, 2.4vw, 30px);
}

p, li {
    font-size: clamp(16px, 1.6vw, 21px);
}

footer {
    text-align: center;
    padding: 12px;
}

footer img {
    width: auto;
    max-width: 55px;
    height: 45px;
    object-fit: contain;
}

/* Tablets */
@media (max-width: 900px) {
    header {
        justify-content: center;
    }

    nav {
        width: 100%;
    }

    .images {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .container {
        flex-direction: row;
    }

    .food {
        flex: 1 1 220px;
    }
}

/* Phones */
@media (max-width: 600px) {
    header {
        flex-direction: column;
        padding: 10px;
        margin-bottom: 18px;
    }

    header img {
        width: 150px;
        max-height: 110px;
    }

    nav {
        width: 100%;
        gap: 4px;
    }

    nav a {
        font-size: 15px;
        padding: 6px 7px;
        margin: 0;
    }

    .about,
    .contact {
        width: calc(100% - 20px);
        margin: 0 auto 18px;
        padding: 16px 12px;
    }

    .images {
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
        padding: 12px;
    }

    .container {
        flex-direction: column;
        padding: 12px;
    }

    .food {
        width: 100%;
        flex: 1 1 auto;
        padding: 20px 12px;
    }

    .img img {
        height: auto;
        max-height: none;
        object-fit: contain;
    }

    h1, h2, h3, h4 {
        font-size: 22px;
    }

    p, li {
        font-size: 16px;
        line-height: 1.6;
    }

    footer img {
        max-width: 45px;
        height: 40px;
    }
}

</style>
